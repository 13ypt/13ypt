</a></span><dl class="object_sub_description" id="sub-toggle-5236155" style="display:block;  position: relative;  min-height: 72px; "><div class="rightimage"><a title="Open" href="/carlotta-mhm/web/object/3998554;jsessionid=LYEIw2Lnws7xhB-56Vzd53I9YzAyh0woAXBEehlR.webcarl03"><img style="float: right;  margin: 8px;  height: 56px; " class="clearBoth" src="/carlotta-mhm/web/image/tn/4053299/thumbnail.jpg;jsessionid=LYEIw2Lnws7xhB-56Vzd53I9YzAyh0woAXBEehlR.webcarl03" alt="alt" /></a></div><dt>Description</dt><dd><span class="class"><p class="class">The history of Egypt is long, from the first settlements in the Nile Valley around 7000 years ago to the present day. Egypt was for a long period of time ruled by autocratic kings – the pharaohs. At other times, it was part</p><p class="class">of larger empires such as the Persian, Roman and Ottoman.</p><p class="class">The pharaonic culture was characterised by high conservatism.</p><p class="class">Things were – and should be – as they always had been.</p><p class="class">Old traditions and ways of thinking lived on, long after the last pharaohs.</p><p class="class">They were present in the customs and traditions of the Middle Ages and are present in Egypt today.</p><p class="class">Welcome on a walk through the history of Egypt!</p></span></dd><dt>Time - Start</dt><dd><span class="class"><a class="term_search" title="Click here to search for records with this value" onclick="setHidden('element_termdef', '1204'); return setHiddenAndSubmitForm('browse_value', getSpanText(this));" href=".;jsessionid=LYEIw2Lnws7xhB-56Vzd53I9YzAyh0woAXBEehlR.webcarl03">2013<span class="hidden">2013</span></a></span></dd></dl></dd><dt>Exhibition, Part of - Current</dt><dd><a class="object_link" title="Click here to go to this object." href="/carlotta-mhm/web/object/4000961;jsessionid=LYEIw2Lnws7xhB-56Vzd53I9YzAyh0woAXBEehlR.webcarl03">New Egypt, 8, The way to eternal life</a><span class="class"><a id="sub-minimize-5236156" class="sub_collapse" t </a></span><dl class="object_sub_description" id="sub-toggle-4987942" style="display:block;  position: relative;  min-height: 69px; "><div class="rightimage"><a title="Open" href="/carlotta-mhm/web/object/3953643;jsessionid=LYEIw2Lnws7xhB-56Vzd53I9YzAyh0woAXBEehlR.webcarl03"><img style="float: right;  margin: 8px;  height: 53px; " class="clearBoth" src="/carlotta-mhm/web/image/tn/3653323/thumbnail.jpg;jsessionid=LYEIw2Lnws7xhB-56Vzd53I9YzAyh0woAXBEehlR.webcarl03" alt="alt" /></a></div><dt>Description</dt><dd><span class="class"><p class="class">The Egyptian exhibition shows various aspects of life in Pharaonic Egypt from 3000 BC to the Christian era. There are also many objects from the prehistoric period, starting around 5000 BC. Most of the objects came to Sweden in the late 19:century, and have been donated to the museum from private collections.</p><p class="class">The Egyptian Exhibition contains, in addition to mummified humans, also mummies of cats, birds, fishes and snakes. The Goddess Isis with the child Horus in her lap meets the visitors as they enter the exhibition. The pose she holds occurs commonly in western art where the Virgin Mary with the child Jesus often is portrayed in the same position.</p><p class="class">A portrait of the well-known pharaoh Sesostris was donated to Sweden by the Egyptian government in recognition both of Swedish participation when the Assuan-dam was built and of professor Torgny Säve-Söderbergh as an internationally well-known Egyptologist. (www.medelhavsmuseet.se, 2010-09-01)</p><p class="class">The exhibition was made already in 1982. In 2002 there was a change, several of the galleries (4-8) on the upper floor were closed.</p></span></dd><dt>Time - Start</dt><dd><span class="class"><a class="term_search" title="Click here to search for records with this value" onclick="setHidden('element_termdef', '1204'); return setHiddenAndSubmitForm('browse_value', getSpanText(this));" href=".;jsessionid=LYEIw2Lnws7xhB-56Vzd53I9YzAyh0w
